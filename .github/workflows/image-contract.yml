name: API image contract

on:
  workflow_call:
    inputs:
      container_image:
        description: Immutable image reference produced by saludo-cloud-api
        required: true
        type: string
  workflow_dispatch:
    inputs:
      container_image:
        description: Immutable image reference produced by saludo-cloud-api
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-image-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout IaC repository
        uses: actions/checkout@v4
        with:
          repository: peg1163/saludo-cloud-iac
          ref: main

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"

      - name: Validate immutable image reference
        env:
          CONTAINER_IMAGE: ${{ inputs.container_image }}
        run: |
          if [[ ! "$CONTAINER_IMAGE" =~ ^ghcr\.io/peg1163/saludo-cloud@sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid immutable image reference: $CONTAINER_IMAGE" >&2
            exit 1
          fi

      - name: Initialize without backend
        run: terraform init -backend=false

      - name: Validate Terraform
        run: terraform validate

      - name: Record API to IaC handoff
        env:
          CONTAINER_IMAGE: ${{ inputs.container_image }}
        run: |
          {
            echo "## API to IaC image handoff"
            echo
            echo "- API repository: \`peg1163/saludo-cloud-api\`"
            echo "- IaC repository: \`peg1163/saludo-cloud-iac\`"
            echo "- Immutable image: \`$CONTAINER_IMAGE\`"
            echo "- Terraform contract: validated"
            echo "- Azure deployment: requires a separately approved apply"
          } >> "$GITHUB_STEP_SUMMARY"
